defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

models:
  whisper_v3_medium: .
  # phi_4_multimodal_instruct: models/Phi-4-multimodal-instruct
  # phi_4_with_stutter_prompt: models/Phi-4-multimodal-instruct
datasets:
  bbbenji: data/bbbenji

max_samples_per_dataset: 1
batch_size: 10
output_dir: output
results_dir: output/results
dataset_cache_dir: output/dataset_cache
asr_cache_dir: output/asr_cache
use_asr_cache: true
load_datasets_from_cache: false
max_workers: 4

data_preprocessing:
  remove_punctuation: false
  make_lowercase: false

bbbenji:
  subset: stuttered
