defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

hydra:
  output_subdir: null
  run:
    dir: .

models:
  - whisper_v3_medium_chinese
  - staccato_chinese
  # - whisper_v3_medium_english
  # - phi_4_multimodal_instruct
  # phi_4_with_stutter_prompt: models/Phi-4-multimodal-instruct
datasets:
  # - bbbenji
  - as70

max_samples_per_dataset: 300
batch_size: 5
output_dir: output
results_dir: output/results
max_workers: 4
max_output_tokens: 2000

eval_preprocessing:
  remove_punctuation: true
  make_lowercase: true
  remove_spaces: true

bbbenji:
  subset: stuttered
